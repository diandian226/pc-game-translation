name: 问题反馈
description: 反馈汉化工具或中文补丁的问题。
title: "[问题反馈] "
body:
  - type: markdown
    attributes:
      value: |
        请尽量说明出错的位置与过程，提交前可先查看是否已有同类问题。
  - type: input
    id: tool_version
    attributes:
      label: 汉化工具版本
      placeholder: 例如：0.3.1
    validations:
      required: true
  - type: input
    id: game_version
    attributes:
      label: 游戏名称和版本
      placeholder: 例如：FMGWorld 0.2.1；工具本身的问题可不填
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题
      description: 请说明你希望发生什么，以及实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 操作步骤或报错内容
      description: 可填写复现步骤，并粘贴具体报错。
  - type: textarea
    id: attachments
    attributes:
      label: 附件（可选）
      description: 可把截图、日志或压缩包拖到此输入框。请确认附件中没有你不想公开的信息。
